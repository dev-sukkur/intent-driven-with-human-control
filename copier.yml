# Install into a project:     copier copy --trust gh:dev-sukkur/intent-driven-with-human-control <folder>
# Pull a newer version later:  copier update --trust      (a 3-way merge; conflicts show inline)
# Change one answer:           copier update --trust --defaults --data <question>=<value>
#
# The answers below are the only project-specific values. They are written to
# .copier-answers.yml, which the skills read at run time, so no skill is edited per project.

_min_copier_version: "9.4"
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_preserve_symlinks: true # .claude/skills/* link to .agents/skills/*

# Template-repo files that a project does not get. Copier's own defaults are repeated, because
# setting _exclude replaces them. A leading / anchors a pattern to the root: without it,
# README.md would also drop every skill's and schema's README.
_exclude:
  - copier.yml
  - copier.yaml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - /.github/README.md # this template's own README; README.md.jinja is the project's starting point
  - /INSTALL_TEMPLATE.md
  - /LICENSE.md
  - /package.json
  - /package-lock.json
  - /.github/PULL_REQUEST_TEMPLATE.md

# Files a project usually has already. Copied only when missing; never overwritten.
_skip_if_exists:
  - .gitignore
  - opencode.json
  - README.md
  - LICENSE
  - docs/process.md
  - docs/pull_request_template.md
  - .github/CODEOWNERS
  - .github/ISSUE_TEMPLATE/work.md
  - .claude/settings.json
  - .github/workflows/ci.yml
  - .github/workflows/mutation.yml
  - .github/dependabot.yml
  - .github/release-drafter.yml
  - .github/workflows/release.yml
  - docs/runbook.md
  - docs/architecture.md

repo:
  type: str
  help: GitHub repository, as owner/name (issues, labels and PRs go here)
  validator: "{% if repo.count('/') != 1 or ' ' in repo %}Use owner/name, for example acme/shop{% endif %}"

extra_labels:
  type: yaml
  help: >-
    Labels this project adds to the shared ones (red, yellow, green, chore), as a YAML list,
    for example [{name: "area:web", color: "1d76db", description: "Applied from file paths"}]
  default: []

acceptance_stack:
  type: str
  help: Acceptance-test stack - javascript (cucumber-js with Playwright) or python (behave with Playwright)
  choices:
    - javascript
    - python
  default: javascript

desktop_first:
  type: bool
  help: Build and check UI for desktop first, with phone work only when a piece of work asks for it?
  default: true

ui_verifier_width:
  type: int
  help: Screen width in pixels at which the UI verifier checks the built UI
  default: 1280

screenshots_in_prs:
  type: bool
  help: Put the UI verifier's screenshots in PR bodies?
  default: false

licence:
  type: str
  help: Licence for the project's LICENSE file (none writes no file)
  choices:
    - MIT
    - none
  default: MIT

copyright_holder:
  type: str
  help: Copyright holder for the licence, for example "Jane Doe and Acme contributors"
  when: "{{ licence != 'none' }}"
  default: "{{ repo.split('/')[0] }} and contributors"

adr_dir:
  type: str
  help: >-
    Folder for ADRs. Keep "adr" (the upstream schema's place); change it only for a project that
    cannot move its ADRs yet
  default: adr
